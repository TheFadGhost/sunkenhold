[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sunkenhold"
version = "0.2.0"
description = "A turn-based ASCII roguelike of a drowned keep"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
sunkenhold = "sunkenhold.cli:main"

[tool.setuptools.packages.find]
include = ["sunkenhold*"]
